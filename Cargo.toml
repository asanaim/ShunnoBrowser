[package]
name = "shunno-browser"
version = "1.3.0"
edition = "2021"
description = "Shunno Browser — Lightweight Desktop Web Browser & Multi-Threaded Download Manager"
build = "build.rs"

[[bin]]
name = "ShunnoBrowser"
path = "src/main.rs"

[dependencies]
tao = "=0.28.0"
wry = "=0.40.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process"] }
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
futures-util = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
url = "2.5.2"
regex = "1.10.5"
rand = "0.8.5"
dirs = "5.0.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.30.0"
windows = { version = "=0.56.0", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
