[package]
name = "shunno-browser"
version = "2.9.8"
edition = "2021"
description = "Shunno Browser — Lightweight Desktop Web Browser & Native Multi-Threaded Download Manager"
build = "build.rs"
license-file = "LICENSE"
publish = false

[[bin]]
name = "ShunnoBrowser"
path = "src/main.rs"

[dependencies]
tao = "=0.28.0"
wry = "=0.40.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "time"] }
# No "gzip": transparent decompression would make Range offsets refer to compressed bytes and corrupt segmented files.
reqwest = { version = "0.12.5", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
hex = "0.4.3"
url = "2.5.2"
rand = "0.8.5"
dirs = "5.0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.30.0"
windows = { version = "=0.56.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
