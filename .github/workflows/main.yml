name: Build Shunno Browser Rust Windows EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --release

      - name: Build Native Release EXE
        run: cargo build --release

      - name: Prepare Release EXE
        run: |
          mkdir release-exe
          copy target\release\ShunnoBrowser.exe release-exe\ShunnoBrowser.exe

      - name: Upload ShunnoBrowser Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoBrowser-Rust-Windows-EXE
          path: release-exe/ShunnoBrowser.exe

      # Closed source: keep this repo private and publish the EXE to the public
      # releases-only repo asanaim/ShunnoBrowser-Windows. Requires secret RELEASES_TOKEN
      # (fine-grained PAT with Contents: write on that repo). Without it, nothing is published.
      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request' && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Browser (latest build: Native Rust + Edge WebView2 + 32-Thread Shunno Get)"
          make_latest: true
          body: |
            ### Direct 1-Click Download for Windows 10 & 11 (~6 MB)
            Full Naked Browser Pro alternative built in pure Rust + Edge WebView2 with multi-tab Cupertino bar, background YouTube audio, AdBlock, SponsorBlock, Reader Mode, OLED Force-Dark, and integrated 32-thread Shunno Get Download Manager:
            - **[Download ShunnoBrowser.exe](https://github.com/asanaim/ShunnoBrowser-Windows/releases/latest/download/ShunnoBrowser.exe)**
          files: |
            release-exe/ShunnoBrowser.exe
          repository: asanaim/ShunnoBrowser-Windows
          token: ${{ secrets.RELEASES_TOKEN }}
