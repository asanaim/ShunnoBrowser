name: Build Shunno Browser

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Release EXE
        run: cargo build --release

      - name: Prepare Release EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-exe | Out-Null
          Copy-Item "target\release\ShunnoBrowser.exe" "release-exe\ShunnoBrowser.exe" -Force

      - name: Upload ShunnoBrowser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShunnoBrowser-Windows-EXE
          path: release-exe/ShunnoBrowser.exe

      - name: Publish Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Shunno Browser v1.0.0"
          make_latest: true
          body: |
            ### Direct Download for Windows 10 & 11 (64-bit)
            - **[Download ShunnoBrowser.exe](https://github.com/${{ github.repository }}/releases/latest/download/ShunnoBrowser.exe)**
          files: |
            release-exe/ShunnoBrowser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
